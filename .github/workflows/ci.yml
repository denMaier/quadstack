name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: make test
      # The Proxmox scripts use variables the community-scripts engine defines
      - run: shellcheck -S warning deploy/install.sh
      - run: shellcheck -S warning -e SC1090,SC2034,SC2154 deploy/proxmox/ct/*.sh deploy/proxmox/install/*.sh
