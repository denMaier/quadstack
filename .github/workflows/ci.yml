name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits; the comment names the release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Podman brings the real quadlet generator, which the validation tests run against
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq podman
      - run: make web
      - run: make test
      # The Proxmox scripts use variables the community-scripts engine defines
      - run: shellcheck -S warning deploy/install.sh
      - run: shellcheck -S warning -e SC1090,SC2034,SC2154 deploy/proxmox/ct/*.sh deploy/proxmox/install/*.sh
